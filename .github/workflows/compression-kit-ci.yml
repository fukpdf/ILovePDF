name: Browser Compression Kit CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - fix/browser-compress-kit-integration

permissions:
  contents: write

jobs:
  compression-kit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies and reconcile the currently stale lockfile
        run: npm install --no-audit --no-fund
      - name: Reconcile lockfile on this same-repository draft branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/compression-kit-mainline-20261010'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_HEAD_REF"
          git stash push -- package-lock.json
          git checkout -B "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"
          git stash pop
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile update required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(compression): synchronize dependency lockfile"
          git push origin "HEAD:$GITHUB_HEAD_REF"
      - name: Upload resolved lockfile for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compression-package-lock-${{ github.run_id }}
          path: package-lock.json
          if-no-files-found: error
      - name: Typecheck
        run: npm run typecheck
      - name: Full regression suite
        run: npm test
      - name: Build browser compression bundle and stage local WASM
        run: npm run build
