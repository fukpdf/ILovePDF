name: Deploy Project

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Stamp deployment version
        shell: bash
        run: printf '%s\\n' "$GITHUB_SHA" > public/deploy-version.txt

      - name: Install locked dependencies
        run: npm ci --omit=dev
      - name: Syntax audit — cloudflare
        run: |
          set -euo pipefail
          find cloudflare -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do node --check "$file"; done
      - name: Syntax audit — controllers
        run: |
          set -euo pipefail
          find controllers -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do node --check "$file"; done
      - name: Syntax audit — middleware
        run: |
          set -euo pipefail
          find middleware -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do node --check "$file"; done
      - name: Syntax audit — routes
        run: |
          set -euo pipefail
          find routes -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do node --check "$file"; done
      - name: Syntax audit — scripts
        run: |
          set -euo pipefail
          find scripts -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do node --check "$file"; done
      - name: Syntax audit — utils
        run: |
          set -euo pipefail
          find utils -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do node --check "$file"; done
      - name: Syntax audit — server
        run: node --check server.js
      - name: JavaScript syntax audit — public core workers
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for root in public/admin/js public/core public/workers public/laba; do
            while IFS= read -r -d '' file; do node --check "$file"; count=$((count + 1)); done < <(find "$root" -type f -name '*.js' -print0)
          done
          node --check public/script.js
          node --check public/sw.js
          count=$((count + 2))
          echo "Public core/worker syntax checked: $count JavaScript files"
      - name: JavaScript syntax audit — public application code
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do node --check "$file"; count=$((count + 1)); done < <(find public/js -type f -name '*.js' -not -path 'public/js/bundles/*' -print0)
          echo "Public application syntax checked: $count JavaScript files"
      - name: JavaScript syntax audit — generated bundles
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do node --check "$file"; count=$((count + 1)); done < <(find public/js/bundles -type f -name '*.js' -print0)
          echo "Generated bundle syntax checked: $count JavaScript files"
      - name: Enterprise source gate
        run: npm test
      - name: Security regression audit
        run: npm run audit:security
      - name: Runtime consistency audit
        run: npm run audit:runtime
      - name: Phase 3 security + file lifecycle audit
        run: npm run audit:phase3
      - name: Phase 4 tool registry audit
        run: npm run audit:phase4
      - name: Phase 5 standard tool audit
        run: npm run audit:phase5
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy Firebase Hosting
        run: |
          npx --yes firebase-tools@13 deploy --only hosting --project ilovepdf-web --non-interactive
      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/worker
          wranglerVersion: "4"
          command: deploy
          secrets: |
            HF_API_TOKEN
        env:
          HF_API_TOKEN: ${{ secrets.HF_TOKEN }}
      - name: Production HTTP smoke validation
        shell: bash
        run: |
          set -euo pipefail
          base="${PRODUCTION_BASE_URL:-https://ilovepdf.cyou}"
          origin="${PRODUCTION_ORIGIN_URL:-https://ilovepdf-web.web.app}"
          echo "Smoke origin: $origin"
          echo "Smoke public domain: $base"

          smoke_path() {
            local host="$1" path="$2" body="/tmp/ilpdf-smoke"
            local code
            if ! code="$(curl -L --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 -sS -o "$body" -w '%{http_code}' "$host$path")"; then
              echo "FAIL network: $host$path"
              return 1
            fi
            if [ "$code" != "200" ] || [ ! -s "$body" ]; then
              echo "FAIL HTTP: $host$path [$code]"
              head -c 300 "$body" || true
              return 1
            fi
            echo "PASS $host$path [$code]"
          }

          for path in / /crop-pdf /rotate-pdf /js/tools-config.js /js/tool-page.js /deploy-version.txt; do
            smoke_path "$origin" "$path"
          done


          for path in / /crop-pdf /rotate-pdf /js/tools-config.js /js/tool-page.js /deploy-version.txt; do
            smoke_path "$base" "$path"
          done

          deployed_sha="$(curl -L --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 -sS "$base/deploy-version.txt" | tr -d '\r\n')"
          if [ "$deployed_sha" != "$GITHUB_SHA" ]; then
            echo "FAIL stale deployment: expected $GITHUB_SHA got $deployed_sha"
            exit 1
          fi
          echo "PASS deployment version: $deployed_sha"

          config="$(curl -L --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 -sS "$base/js/tools-config.js")"
          node - "$config" <<'NODE'
          const config = process.argv[2];
          for (const id of ['crop','rotate','merge']) {
            const re = /id\s*:\s*['\"]([^'\"]+)['\"]/g;
            let match; let start = -1;
            while ((match = re.exec(config))) { if (match[1] === id) { start = match.index; break; } }
            if (start < 0) throw new Error('production config missing tool: ' + id);
            const windowText = config.slice(start, start + 900);
            if (!/working\s*:\s*true/.test(windowText)) throw new Error('production config working=false: ' + id);
            console.log('PASS production config working=true:', id);
          }
          NODE

          for path in /crop-pdf /rotate-pdf; do
            html="$(curl -L --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 -sS "$base$path")"
            printf '%s' "$html" | grep -q '/js/tool-page.js'
            printf '%s' "$html" | grep -q '/js/tools-config.js'
            if printf '%s' "$html" | grep -qi 'Coming Soon'; then
              echo "FAIL stale Coming Soon shell: $base$path"
              exit 1
            fi
            echo "PASS production tool shell: $base$path"
          done
