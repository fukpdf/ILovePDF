name: Phase 5 Scheduler Routing Fairness

on:
  push:
    branches: [main]
    paths:
      - 'public/js/runtime-task-scheduler.js'
      - 'public/js/runtime-worker-routing.js'
      - 'scripts/phase5-units-229-241-check.js'
      - '.github/workflows/phase5-scheduler-routing-fairness.yml'
  pull_request:
    branches: [main]
    paths:
      - 'public/js/runtime-task-scheduler.js'
      - 'public/js/runtime-worker-routing.js'
      - 'scripts/phase5-units-229-241-check.js'
      - '.github/workflows/phase5-scheduler-routing-fairness.yml'

jobs:
  scheduler-routing-fairness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/phase5-units-229-241-check.js
