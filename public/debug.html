<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>ILovePDF Debug Console — __BUILD_ID__</title>

  <!-- Expose BUILD_ID to Arc10 shell -->
  <!-- Security: X-Robots-Tag:noindex,nofollow set via routes/debug.js response header -->
  <!-- Gate keys: ilpdf_dash (sessionStorage) | ilpdf_admin (localStorage) | ?debug=1 (query) -->
  <script>window.__BUILD_ID__ = '__BUILD_ID__';</script>

  <style>
    /* ── Reset + base ─────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0d0d1a; color: #d0d8f0; font-family: 'Consolas', 'Menlo', monospace; font-size: 13px; overflow: hidden; }

    /* ── Debug root ──────────────────────────────────────────────────── */
    .dbg-root { display: flex; flex-direction: column; height: 100vh; width: 100vw; overflow: hidden; }

    /* ── Header ──────────────────────────────────────────────────────── */
    .dbg-header {
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      padding: 8px 16px; background: #111128; border-bottom: 1px solid #2a2a4a;
      flex-shrink: 0;
    }
    .dbg-logo   { font-size: 15px; font-weight: 700; color: #7af; white-space: nowrap; }
    .dbg-build  { color: #888; font-size: 11px; }
    .dbg-arc    { color: #4af; font-size: 11px; }

    /* ── Navigation tabs ─────────────────────────────────────────────── */
    .dbg-nav {
      display: flex; gap: 2px; flex-wrap: wrap; flex-shrink: 0;
      padding: 6px 8px; background: #0f0f22; border-bottom: 1px solid #2a2a4a;
      overflow-x: auto;
    }
    .dbg-nav-tab {
      padding: 4px 12px; border-radius: 4px; border: 1px solid #2a2a4a;
      background: #15152e; color: #8ab; cursor: pointer; font-size: 12px;
      white-space: nowrap; transition: background 0.1s;
    }
    .dbg-nav-tab:hover    { background: #1e1e40; color: #cdf; }
    .dbg-nav-active       { background: #1a3060 !important; color: #7af !important; border-color: #4af !important; }

    /* ── Panel body ──────────────────────────────────────────────────── */
    .dbg-body   { flex: 1; overflow-y: auto; padding: 12px; }
    .dbg-panel  { min-height: 100%; }

    /* ── Panel toolbar ───────────────────────────────────────────────── */
    .panel-toolbar {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid #2a2a4a;
    }
    .panel-title  { font-size: 15px; font-weight: 700; color: #adf; margin-right: auto; }
    .panel-subtitle { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.05em; margin: 10px 0 4px; }

    /* ── Buttons ─────────────────────────────────────────────────────── */
    .dbg-btn {
      padding: 4px 10px; border-radius: 4px; border: 1px solid #3a3a5a;
      background: #1a1a36; color: #adf; cursor: pointer; font-size: 11px;
      white-space: nowrap;
    }
    .dbg-btn:hover      { background: #252550; border-color: #5a5a8a; }
    .dbg-btn-sm         { padding: 2px 7px; font-size: 10px; }
    .dbg-btn-warn       { border-color: #a44; color: #faa; }
    .dbg-btn-warn:hover { background: #2a1520; }
    .dbg-btn-active     { background: #1a3060; border-color: #4af; color: #7af; }

    /* ── Inputs ──────────────────────────────────────────────────────── */
    .dbg-input, .dbg-sel {
      padding: 3px 8px; border-radius: 4px; border: 1px solid #3a3a5a;
      background: #12122a; color: #cdf; font-size: 11px; font-family: inherit;
    }
    .dbg-input:focus, .dbg-sel:focus { outline: none; border-color: #4af; }

    /* ── Metrics strip ───────────────────────────────────────────────── */
    .panel-metrics { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; align-items: center; }
    .metric-chip   { padding: 2px 8px; background: #1a2840; border-radius: 12px; font-size: 11px; color: #8cf; white-space: nowrap; }
    .chip-warn     { padding: 2px 8px; background: #2a1520; border-radius: 12px; font-size: 11px; color: #f88; white-space: nowrap; }

    /* ── Severity badge ──────────────────────────────────────────────── */
    .sev-badge { display: inline-block; margin-right: 4px; }

    /* ── Incident rows ───────────────────────────────────────────────── */
    .panel-list-wrap { }
    .inc-row    { padding: 6px 8px; border-bottom: 1px solid #1a1a30; border-left: 3px solid #2a2a4a; margin-bottom: 2px; border-radius: 0 4px 4px 0; }
    .inc-row:hover  { background: #13132a; }
    .inc-resolved   { opacity: 0.45; }
    .inc-cat    { font-weight: 600; color: #bdf; }
    .inc-msg    { color: #aaa; font-size: 11px; margin: 2px 0; }
    .inc-meta   { font-size: 10px; color: #666; display: flex; gap: 8px; flex-wrap: wrap; }
    .inc-count  { color: #fa8; font-weight: 700; }
    .inc-suggest { font-size: 10px; color: #8fa; margin-top: 2px; }

    /* ── Timeline rows ───────────────────────────────────────────────── */
    .tl-row     { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-bottom: 1px solid #16162a; height: 28px; overflow: hidden; }
    .tl-row:hover { background: #13132a; }
    .tl-ts      { color: #566; font-size: 10px; width: 70px; flex-shrink: 0; }
    .tl-type    { color: #9af; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tl-tool    { color: #a8c; font-size: 10px; }
    .tr-slow    { border-left: 3px solid #f44; }

    /* ── Recovery graph ──────────────────────────────────────────────── */
    .rec-chip   { padding: 2px 6px; background: #1a3050; border-radius: 3px; font-size: 10px; color: #8cf; white-space: nowrap; }
    .rec-graph  { line-height: 2; }

    /* ── Blackbox gauge ──────────────────────────────────────────────── */
    .bb-gauge-bar  { transition: width 0.3s; }
    .bb-gauge-wrap { display: flex; align-items: center; gap: 4px; }

    /* ── Empty states ────────────────────────────────────────────────── */
    .empty-state { padding: 24px; text-align: center; color: #446; font-size: 12px; }

    /* ── Panel section spacing ───────────────────────────────────────── */
    .panel-section { margin-bottom: 12px; }

    /* ── Mobile compact ──────────────────────────────────────────────── */
    @media (max-width: 768px) {
      .dbg-body  { padding: 8px; }
      html, body { overflow: auto; }
      .dbg-root  { height: auto; }
      .dbg-body  { overflow: visible; }
      .panel-toolbar { font-size: 11px; }
      .dbg-btn   { padding: 3px 7px; font-size: 10px; }
    }

    /* ── Scrollbars ──────────────────────────────────────────────────── */
    ::-webkit-scrollbar       { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0d0d1a; }
    ::-webkit-scrollbar-thumb { background: #2a2a4a; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #4a4a6a; }

    /* ── Gate screen ─────────────────────────────────────────────────── */
    #gate-screen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; gap: 16px; text-align: center;
    }
    #gate-screen h1 { color: #f44; font-size: 22px; }
    #gate-screen p  { color: #888; max-width: 400px; }
  </style>
</head>
<body>

  <!-- Gate fallback (shown if JS fails or access denied) -->
  <div id="gate-screen" style="display:none">
    <h1>🔒 Access Denied</h1>
    <p>This page requires debug access.<br>Add <code>?debug=1</code> to the URL, or set <code>localStorage.ilpdf_admin = "1"</code> in the browser console.</p>
    <a href="/" style="color:#4af">← Return to app</a>
  </div>

  <!-- Arc 8 runtime systems (required for panel data) -->
  <!-- Loaded from the main bundles so panels have access to all runtime APIs -->
  <script src="/js/bundles/runtime-arc2.bundle.js" defer></script>
  <script src="/js/bundles/runtime-arc3.bundle.js" defer></script>
  <script src="/js/bundles/runtime-arc4.bundle.js" defer></script>
  <script src="/js/bundles/runtime-arc5.bundle.js" defer></script>
  <script src="/js/bundles/runtime-arc6.bundle.js" defer></script>
  <script src="/js/bundles/runtime-arc7.bundle.js" defer></script>
  <script src="/js/bundles/runtime-arc8.bundle.js" defer></script>
  <script src="/js/bundles/runtime-arc9.bundle.js" defer></script>

  <!-- Arc 10D: Debug Console (security gate first, then shell + panels) -->
  <script src="/js/bundles/runtime-arc10.bundle.js" defer></script>
  <script src="/js/bundles/runtime-arc11.bundle.js" defer></script>
  <script src="/js/bundles/runtime-arc12.bundle.js" defer></script>
  <script src="/js/bundles/runtime-arc13.bundle.js" defer></script>
  <script src="/js/bundles/runtime-arc14.bundle.js" defer></script>
  <script src="/js/bundles/runtime-arc15.bundle.js" defer></script>

  <!-- Bootstrap: init shell after all deferred scripts load -->
  <script>
    window.addEventListener('load', function () {
      // Show gate screen if access is denied
      var Sec = window.RuntimeDebugSecurity;
      if (!Sec || !Sec.isAllowed()) {
        document.getElementById('gate-screen').style.display = 'flex';
        return;
      }
      // Init shell
      var Shell = window.RuntimeDebugShell;
      if (Shell && typeof Shell.init === 'function') {
        Shell.init();
      } else {
        document.body.innerHTML = '<div style="padding:40px;color:#f88;font-family:monospace;">⚠ RuntimeDebugShell failed to load. Check console for errors.</div>';
      }
    });
  </script>

</body>
</html>
