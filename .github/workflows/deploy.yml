name: Deploy Project

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Deployment is blocked unless the production source gates pass on this commit.
      - name: Install locked dependencies
        run: npm ci --omit=dev

      - name: JavaScript syntax audit
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            node --check "$file"
            count=$((count + 1))
          done < <(find . -type f -name '*.js' \
            -not -path './node_modules/*' \
            -not -path './.git/*' \
            -print0)
          echo "Syntax checked: $count JavaScript files"

      - name: Enterprise source gate
        run: npm test

      - name: Security regression audit
        run: npm run audit:security

      - name: Runtime consistency audit
        run: npm run audit:runtime

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firebase Hosting
        run: |
          npx --yes firebase-tools@13 deploy \
            --only hosting \
            --project ilovepdf-web \
            --non-interactive

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/worker
          command: deploy
          secrets: |
            HF_API_TOKEN
        env:
          HF_API_TOKEN: ${{ secrets.HF_TOKEN }}
