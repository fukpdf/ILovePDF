name: Phase 5 Worker Domain Integrity 294-306
on:
  push:
    branches: [main]
    paths:
      - 'public/js/runtime-worker-mesh.js'
      - 'public/js/runtime-worker-domain-registry.js'
      - 'public/js/runtime-worker-domain-throttle.js'
      - 'scripts/phase5-units-294-306-worker-domain-integrity-check.js'
      - 'package.json'
      - '.github/workflows/phase5-worker-domain-integrity-294-306.yml'
  pull_request:
    paths:
      - 'public/js/runtime-worker-mesh.js'
      - 'public/js/runtime-worker-domain-registry.js'
      - 'public/js/runtime-worker-domain-throttle.js'
      - 'scripts/phase5-units-294-306-worker-domain-integrity-check.js'
      - 'package.json'
      - '.github/workflows/phase5-worker-domain-integrity-294-306.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      - run: npm run audit:phase5:worker-domain-integrity-294-306
