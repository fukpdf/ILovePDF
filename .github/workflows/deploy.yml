name: Deploy Project

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --omit=dev

      - name: Syntax audit — cloudflare
        run: |
          set -euo pipefail
          find cloudflare -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do node --check "$file"; done

      - name: Syntax audit — controllers
        run: |
          set -euo pipefail
          find controllers -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do node --check "$file"; done

      - name: Syntax audit — middleware
        run: |
          set -euo pipefail
          find middleware -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do node --check "$file"; done

      - name: Syntax audit — routes
        run: |
          set -euo pipefail
          find routes -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do node --check "$file"; done

      - name: Syntax audit — scripts
        run: |
          set -euo pipefail
          find scripts -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do node --check "$file"; done

      - name: Syntax audit — utils
        run: |
          set -euo pipefail
          find utils -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do node --check "$file"; done

      - name: Syntax audit — server
        run: node --check server.js

      - name: JavaScript syntax audit — public core workers
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for root in public/admin/js public/core public/workers public/laba; do
            while IFS= read -r -d '' file; do
              node --check "$file"
              count=$((count + 1))
            done < <(find "$root" -type f -name '*.js' -print0)
          done
          node --check public/script.js
          node --check public/sw.js
          count=$((count + 2))
          echo "Public core/worker syntax checked: $count JavaScript files"

      - name: JavaScript syntax audit — public application code
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            node --check "$file"
            count=$((count + 1))
          done < <(find public/js -type f -name '*.js' -not -path 'public/js/bundles/*' -print0)
          echo "Public application syntax checked: $count JavaScript files"

      - name: JavaScript syntax audit — generated bundles
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            node --check "$file"
            count=$((count + 1))
          done < <(find public/js/bundles -type f -name '*.js' -print0)
          echo "Generated bundle syntax checked: $count JavaScript files"

      - name: Enterprise source gate
        run: npm test

      - name: Security regression audit
        run: npm run audit:security

      - name: Runtime consistency audit
        run: npm run audit:runtime

      - name: Phase 3 security + file lifecycle audit
        run: npm run audit:phase3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firebase Hosting
        run: |
          npx --yes firebase-tools@13 deploy \
            --only hosting \
            --project ilovepdf-web \
            --non-interactive

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/worker
          wranglerVersion: "4"
          command: deploy
          secrets: |
            HF_API_TOKEN
        env:
          HF_API_TOKEN: ${{ secrets.HF_TOKEN }}
