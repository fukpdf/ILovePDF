name: Phase 3 Security Validation File Lifecycle Closure
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  phase3-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --omit=dev
      - run: node scripts/phase3-security-validation-file-lifecycle-closure-check.js
      - run: npm run audit:security
      - run: npm run audit:runtime
