name: Phase 5 Standard Tool Contract

on:
  push:
    branches: [main]
    paths:
      - 'config/tool-registry.json'
      - 'public/config/tool-registry.json'
      - 'public/js/**'
      - 'public/workers/**'
      - 'public/tool.html'
      - 'public/*.html'
      - 'scripts/phase5-standard-tool-check.js'
      - 'package.json'
      - '.github/workflows/phase5-standard-tool.yml'
  pull_request:
    paths:
      - 'config/tool-registry.json'
      - 'public/config/tool-registry.json'
      - 'public/js/**'
      - 'public/workers/**'
      - 'public/tool.html'
      - 'public/*.html'
      - 'scripts/phase5-standard-tool-check.js'
      - 'package.json'
      - '.github/workflows/phase5-standard-tool.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Phase 5 standard-tool contract audit
        run: npm run audit:phase5
