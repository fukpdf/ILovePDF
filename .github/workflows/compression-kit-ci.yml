name: Browser Compression Kit CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - fix/browser-compress-kit-integration

permissions:
  contents: read

jobs:
  compression-kit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies and reconcile the currently stale lockfile
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Full regression suite
        run: npm test
      - name: Build browser compression bundle and stage local WASM
        run: npm run build
