name: Phase 2 Shared Design Platform Closure

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  phase2-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --omit=dev
      - run: node scripts/phase2-shared-design-platform-closure-check.js
