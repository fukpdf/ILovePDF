name: Compression regression guard

on:
  pull_request:
    paths:
      - 'public/workers/pdf-worker.js'
      - 'public/js/tool-page.js'
      - 'scripts/compress-hybrid-regression-check.js'
      - 'scripts/compress-wasm-cli-static-check.js'
      - 'docs/compression-kit-merge-status.md'
      - '.github/workflows/compression-regression.yml'
  push:
    branches:
      - main
      - 'fix/browser-compress-kit-integration'
    paths:
      - 'public/workers/pdf-worker.js'
      - 'public/js/tool-page.js'
      - 'scripts/compress-hybrid-regression-check.js'
      - 'scripts/compress-wasm-cli-static-check.js'
      - 'src/browser/wasmCli.ts'
      - 'src/browser/wasm-modules.d.ts'
      - 'docs/compression-kit-merge-status.md'
      - '.github/workflows/compression-regression.yml'

jobs:
  static-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check regression script syntax
        run: node --check scripts/compress-hybrid-regression-check.js && node --check scripts/compress-wasm-cli-static-check.js
      - name: Run compression static regression checks
        run: node scripts/compress-hybrid-regression-check.js
      - name: Run WASM CLI adapter static checks
        run: node scripts/compress-wasm-cli-static-check.js
      - name: Typecheck WASM adapter against published package APIs
        shell: bash
        run: |
          mkdir -p /tmp/wasm-adapter-check/src/browser
          cp src/browser/wasmCli.ts src/browser/wasm-modules.d.ts /tmp/wasm-adapter-check/src/browser/
          cd /tmp/wasm-adapter-check
          npm init -y
          npm install --no-save --no-package-lock --no-audit --no-fund typescript@5.6.3 @jspawn/ghostscript-wasm@0.0.2 @neslinesli93/qpdf-wasm@0.3.0
          npx tsc --noEmit --strict --target ES2022 --module ESNext --moduleResolution bundler src/browser/wasmCli.ts src/browser/wasm-modules.d.ts
