name: Source Audit

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci --omit=dev

      - name: JavaScript syntax audit — backend
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for root in cloudflare controllers middleware routes scripts utils; do
            while IFS= read -r -d '' file; do
              node --check "$file"
              count=$((count + 1))
            done < <(find "$root" -type f -name '*.js' -print0)
          done
          node --check server.js
          count=$((count + 1))
          echo "Backend syntax checked: $count JavaScript files"

      - name: JavaScript syntax audit — public core workers
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for root in public/admin/js public/core public/workers public/laba; do
            while IFS= read -r -d '' file; do
              node --check "$file"
              count=$((count + 1))
            done < <(find "$root" -type f -name '*.js' -print0)
          done
          node --check public/script.js
          node --check public/sw.js
          count=$((count + 2))
          echo "Public core/worker syntax checked: $count JavaScript files"

      - name: JavaScript syntax audit — public application code
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            node --check "$file"
            count=$((count + 1))
          done < <(find public/js -type f -name '*.js' -not -path 'public/js/bundles/*' -print0)
          echo "Public application syntax checked: $count JavaScript files"

      - name: JavaScript syntax audit — generated bundles
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            node --check "$file"
            count=$((count + 1))
          done < <(find public/js/bundles -type f -name '*.js' -print0)
          echo "Generated bundle syntax checked: $count JavaScript files"

      - name: Enterprise source gate
        run: npm test

      - name: Security regression audit
        run: npm run audit:security

      - name: Runtime consistency audit
        run: npm run audit:runtime

      - name: Phase 5 standard tool audit
        run: npm run audit:phase5

      - name: Special-page i18n coverage audit
        run: node scripts/audit-special-i18n.js
