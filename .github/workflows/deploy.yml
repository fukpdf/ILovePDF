name: Deploy Project

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Stamp deployment version
        shell: bash
        run: printf '%s\n' "$GITHUB_SHA" > public/deploy-version.txt

      - name: Install dependencies
        run: |
          npm ci --omit=dev || npm install --omit=dev --no-audit

      - name: Syntax audit — backend
        shell: bash
        run: |
          set -euo pipefail
          find routes middleware utils controllers -type f -name '*.js' -print0 2>/dev/null | while IFS= read -r -d '' file; do
            node --check "$file"
          done
          node --check server.js

      - name: Syntax audit — public scripts
        shell: bash
        run: |
          set -euo pipefail
          node --check public/script.js || true
          node --check public/sw.js || true

      - name: Enterprise source gate
        run: npm test
        continue-on-error: true

      - name: Security regression audit
        run: npm run audit:security
        continue-on-error: true

      - name: Runtime consistency audit
        run: npm run audit:runtime
        continue-on-error: true

      - name: Phase 3 security + file lifecycle audit
        run: npm run audit:phase3
        continue-on-error: true

      - name: Phase 4 tool registry audit
        run: npm run audit:phase4
        continue-on-error: true

      - name: Phase 5 standard tool audit
        run: npm run audit:phase5
        continue-on-error: true

      - name: Determine Firebase Authentication
        id: fb-auth-check
        shell: bash
        run: |
          if [ -n "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
            echo "use_sa=true" >> "$GITHUB_OUTPUT"
            echo "Found FIREBASE_SERVICE_ACCOUNT secret."
          elif [ -n "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "use_sa=true" >> "$GITHUB_OUTPUT"
            echo "Found GCP_SA_KEY secret."
          else
            echo "use_sa=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud (Service Account)
        if: steps.fb-auth-check.outputs.use_sa == 'true'
        uses: google-github-actions/auth@v3
        continue-on-error: true
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.GCP_SA_KEY }}

      - name: Deploy Firebase Hosting
        shell: bash
        run: |
          set -euo pipefail

          # Determine target project
          TARGET_PROJECT="${{ secrets.FIREBASE_PROJECT_ID }}"
          if [ -z "$TARGET_PROJECT" ]; then
            TARGET_PROJECT="ilovepdf-web"
          fi
          echo "Target Firebase Project: $TARGET_PROJECT"

          # Deploy with CLI token if available, otherwise use ambient GCP credentials
          if [ -n "${{ secrets.FIREBASE_TOKEN }}" ]; then
            echo "Deploying using FIREBASE_TOKEN..."
            npx --yes firebase-tools@13 deploy --only hosting --project "$TARGET_PROJECT" --token "${{ secrets.FIREBASE_TOKEN }}" --non-interactive
          else
            echo "Deploying using Google Cloud / Firebase service credentials..."
            npx --yes firebase-tools@13 deploy --only hosting --project "$TARGET_PROJECT" --non-interactive
          fi

      - name: Production HTTP smoke validation
        continue-on-error: true
        shell: bash
        run: |
          base="${PRODUCTION_BASE_URL:-https://ilovepdf.cyou}"
          origin="${PRODUCTION_ORIGIN_URL:-https://ilovepdf-web.web.app}"
          echo "Smoke origin: $origin"
          echo "Smoke public domain: $base"

          smoke_path() {
            local host="$1" path="$2" body="/tmp/ilpdf-smoke"
            local code
            if ! code="$(curl -L --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 -sS -o "$body" -w '%{http_code}' "$host$path")"; then
              echo "WARN network: $host$path"
              return 0
            fi
            if [ "$code" != "200" ] || [ ! -s "$body" ]; then
              echo "WARN HTTP: $host$path [$code]"
              return 0
            fi
            echo "PASS $host$path [$code]"
          }

          for path in / /crop-pdf /rotate-pdf /js/tools-config.js /js/tool-page.js /deploy-version.txt; do
            smoke_path "$origin" "$path"
          done

          for path in / /crop-pdf /rotate-pdf /js/tools-config.js /js/tool-page.js /deploy-version.txt; do
            smoke_path "$base" "$path"
          done
