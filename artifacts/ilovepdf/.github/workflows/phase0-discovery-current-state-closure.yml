name: Phase 0 Discovery Current-State Closure

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  phase0-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --omit=dev
      - run: node scripts/phase0-discovery-current-state-closure-check.js
