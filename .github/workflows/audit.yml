name: Source Audit

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci --omit=dev

      - name: JavaScript syntax audit
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            node --check "$file"
            count=$((count + 1))
          done < <(find . -type f -name '*.js'             -not -path './node_modules/*'             -not -path './.git/*'             -print0)
          echo "Syntax checked: $count JavaScript files"

      - name: Enterprise source gate
        run: npm test

      - name: Security regression audit
        run: npm run audit:security

      - name: Runtime consistency audit
        run: npm run audit:runtime
