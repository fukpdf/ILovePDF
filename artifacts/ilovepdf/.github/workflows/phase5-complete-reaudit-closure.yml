name: Phase 5 Complete Re-audit Closure
on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'public/js/**'
      - 'public/workers/**'
      - 'config/**'
      - 'scripts/phase5-*.js'
      - 'docs/architecture/PHASE-ROADMAP.md'
      - '.github/workflows/phase5-complete-reaudit-closure.yml'
  workflow_dispatch:
jobs:
  phase5-complete-reaudit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      - run: npm run audit:phase5:complete-reaudit-closure
      - run: npm test
      - run: npm run audit:security
      - run: npm run audit:runtime
