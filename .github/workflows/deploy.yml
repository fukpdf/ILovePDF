name: Deploy Project

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Stamp deployment version
        shell: bash
        run: printf '%s\n' "$GITHUB_SHA" > public/deploy-version.txt

      - name: Assemble homepage index (Step-2 critical path)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/assemble-homepage-index.js
          if grep -q 'DecompressionStream' public/index.html; then
            echo '::error::index.html still looks like the chunk loader'
            exit 1
          fi
          if ! grep -q 'home-fast-boot' public/index.html; then
            echo '::error::assembled index missing home-fast-boot'
            exit 1
          fi
          echo '[assemble] public/index.html ready for hosting'
          node scripts/homepage-deep-audit-check.js

      - name: Tool-page fast path (reorder + immediate init)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/reorder-tool-page-scripts.js
          node scripts/patch-tool-page-init.js
          if grep -q 'PLACEHOLDER' public/tool.html; then
            echo '::error::tool.html contains PLACEHOLDER'
            exit 1
          fi
          if ! grep -q 'id="tool-content"' public/tool.html; then
            echo '::error::tool.html missing tool-content'
            exit 1
          fi
          if grep -E '<script[^>]+src=' public/tool.html | grep -v defer | grep -v async | grep -q .; then
            echo '::error::blocking external scripts remain in tool.html'
            exit 1
          fi
          if ! grep -q 'async function initToolPage' public/js/tool-page.js; then
            echo '::error::tool-page.js was not patched for immediate init'
            exit 1
          fi
          echo '[tool-fast-path] tool.html reordered + tool-page.js immediate init OK'

      - name: Install dependencies
        shell: bash
        run: |
          npm ci --omit=dev || npm install --omit=dev --no-audit

      - name: Run project regression tests before deployment
        shell: bash
        run: npm test

      - name: Run security and file-lifecycle audit before deployment
        shell: bash
        run: npm run audit:security

      - name: Syntax check
        shell: bash
        run: |
          set -euo pipefail
          find routes middleware utils controllers -type f -name '*.js' -print0 2>/dev/null | while IFS= read -r -d '' file; do
            node --check "$file"
          done
          node --check server.js
          node --check public/js/tool-page.js
          node --check scripts/compress-hybrid-regression-check.js
          node scripts/compress-hybrid-regression-check.js
          node --check public/script.js || true
          node --check public/sw.js || true
          node --check scripts/assemble-homepage-index.js
          node --check scripts/reorder-tool-page-scripts.js
          node --check scripts/patch-tool-page-init.js

      - name: Deploy to Firebase Hosting
        shell: bash
        env:
          SA_SECRET_1: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SA_SECRET_2: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ILOVEPDF_WEB }}
          SA_SECRET_3: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          SA_SECRET_4: ${{ secrets.GCP_SA_KEY }}
          TOKEN_SECRET: ${{ secrets.FIREBASE_TOKEN }}
          OVERRIDE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          CRED_JSON="${SA_SECRET_1:-${SA_SECRET_2:-${SA_SECRET_3:-${SA_SECRET_4:-}}}}"
          TOKEN_FLAG=""
          DETECTED_PROJECT=""
          if [ -n "$CRED_JSON" ]; then
            echo "$CRED_JSON" > /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
            DETECTED_PROJECT=$(node -e 'try{const sa=JSON.parse(require("fs").readFileSync("/tmp/firebase-sa.json","utf8"));console.log(sa.project_id||"")}catch(_){console.log("")}')
          fi
          if [ -n "$TOKEN_SECRET" ]; then
            TOKEN_FLAG="--token ${TOKEN_SECRET}"
          fi
          TARGET_PROJECT="${OVERRIDE_PROJECT_ID:-${DETECTED_PROJECT:-ilovepdf-web}}"
          echo "[TARGET] Deploying to Firebase project: $TARGET_PROJECT"
          npx --yes firebase-tools@latest deploy --only hosting --project "$TARGET_PROJECT" $TOKEN_FLAG --non-interactive
          echo "[SUCCESS] Firebase deployment completed successfully!"

      - name: Smoke verification
        shell: bash
        run: |
          set -euo pipefail
          base="${PRODUCTION_BASE_URL:-https://ilovepdf.cyou}"
          origin="${PRODUCTION_ORIGIN_URL:-https://ilovepdf-web.web.app}"
          smoke_check() {
            local url="$1"
            local allow_waf_403="${2:-false}"
            local code
            code="$(curl -A 'Mozilla/5.0' -L --retry 3 --connect-timeout 8 --max-time 20 -sS -o /dev/null -w '%{http_code}' "$url" || echo "000")"
            echo "Status $code -> $url"
            if [ "$code" = "403" ] && [ "$allow_waf_403" = "allow" ]; then return 0; fi
            if [ "$code" != "200" ]; then echo "::error::Smoke failed $url ($code)"; return 1; fi
          }
          smoke_check "$origin/"
          smoke_check "$origin/crop-pdf"
          smoke_check "$origin/compress-pdf"
          smoke_check "$origin/js/tools-config.js"
          smoke_check "$origin/js/tool-page.js?v=20261009-hybrid-150dpi-v2"
          smoke_check "$origin/js/home.js"
          smoke_check "$origin/js/home-fast-boot.js"
          smoke_check "$base/compress-pdf" "allow"
          html="$(curl -fLsS --retry 3 --connect-timeout 8 --max-time 20 "$origin/")"
          if echo "$html" | grep -q 'DecompressionStream'; then echo '::error::loader'; exit 1; fi
          if ! echo "$html" | grep -q 'home-fast-boot'; then echo '::error::no fast-boot'; exit 1; fi
          tool_html="$(curl -fLsS --retry 3 --connect-timeout 8 --max-time 20 "$origin/tool.html")"
          if ! echo "$tool_html" | grep -q 'id="tool-content"'; then echo '::error::no tool-content'; exit 1; fi
          deployed_sha="$(curl -fLsS --retry 3 --connect-timeout 8 --max-time 20 "$origin/deploy-version.txt" | tr -d '\r\n')"
          if [ "$deployed_sha" != "$GITHUB_SHA" ]; then echo "::error::sha mismatch"; exit 1; fi
          echo "Deployment version verified: $deployed_sha"
