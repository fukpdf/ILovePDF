name: Sync browser compression dependency lockfile

on:
  push:
    branches:
      - fix/compression-kit-mainline-20261010

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Resolve and update package lock without running install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi
          git commit -m "chore(compression): synchronize dependency lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
