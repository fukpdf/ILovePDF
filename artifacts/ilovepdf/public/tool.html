  <script>
  (function () {
    var host = String(location.hostname || '').toLowerCase();
    var testStaticHost = (host === 'localhost' || host === '127.0.0.1') && new URLSearchParams(location.search).get('static-hosting-test') === '1';
    var staticHost = host.endsWith('.web.app') || host.endsWith('.firebaseapp.com') || host === 'ilovepdf.cyou' || testStaticHost;
    if (!staticHost || typeof window.fetch !== 'function' || window.__ILOVE_STATIC_API_GUARD__) return;
    window.__ILOVE_STATIC_API_GUARD__ = true;
    var nativeFetch = window.fetch;
    window.fetch = function (input, init) {
      var raw = typeof input === 'string' ? input : (input && input.url) || '';
      try {
        var url = new URL(raw, location.href);
        if (url.origin === location.origin && url.pathname.startsWith('/api/')) {
          return Promise.resolve(new Response(JSON.stringify({
            available: false,
            error: 'API backend unavailable on static hosting'
          }), {
            status: 503,
            headers: { 'Content-Type': 'application/json; charset=utf-8', 'Cache-Control': 'no-store' }
          }));
        }
      } catch (_) {}
      return nativeFetch.call(this, input, init);
    };
  })();
  </script>

  <script>
  (function () {
    var src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3242156405919556";
    var loaded = false;
    function loadAds() {
      if (loaded) return;
      // No ad units are currently rendered on the shared tool shell; avoid a
      // third-party request unless a real slot exists in this document.
      if (!document.querySelectorAll('[data-ad-slot], .ad-slot, ins.adsbygoogle').length) return;
      loaded = true;
      var script = document.createElement('script');
      script.async = true;
      script.src = src;
      script.crossOrigin = 'anonymous';
      script.onload = function () {
        if (window.AdManager && typeof window.AdManager.activateAll === 'function') window.AdManager.activateAll();
      };
      document.head.appendChild(script);
    }
    function watchSlots() {
      var slots = document.querySelectorAll('[data-ad-slot], .ad-slot, ins.adsbygoogle');
      if (!('IntersectionObserver' in window) || !slots.length) return;
      var observer = new IntersectionObserver(function (entries) {
        if (entries.some(function (entry) { return entry.isIntersecting; })) {
          observer.disconnect();
          loadAds();
        }
      }, { rootMargin: '0px' });
      slots.forEach(function (slot) { if (slot.getBoundingClientRect().top >= window.innerHeight) observer.observe(slot); });
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', watchSlots, { once: true });
    else watchSlots();
    window.addEventListener('load', function () { setTimeout(loadAds, 4500); }, { once: true });
    window.addEventListener('scroll', loadAds, { once: true, passive: true });
  })();

    function acceptCookies() {
      try {
        localStorage.setItem('ilovepdf_cookies', '1');

      } catch (_) {}
      var banner = document.getElementById('cookie-banner');

  <!-- UI-first runtime loader: keep the upload shell interactive before downloading processors/infrastructure. -->
  <script>
  (function (window, document) {
    'use strict';
    if (window.SharedToolRuntimeBoot) return;
    var state = 'idle';
    var bootPromise = null;
    var lazyNodes = Array.prototype.slice.call(document.querySelectorAll('script[data-lazy-src]'));
    var lazyUrls = lazyNodes.map(function (node) { return node.getAttribute('data-lazy-src'); }).filter(Boolean);
    var completed = Object.create(null);

    function loadAll() {
      if (bootPromise) return bootPromise;
      state = 'loading';
      // A few legacy runtime modules register DOMContentLoaded callbacks
      // unconditionally. Because this stack is intentionally loaded after the
      // first paint, capture only callbacks registered by this lazy stack and
      // invoke them once after every dependency has executed.
      var originalAddEventListener = document.addEventListener;
      var queuedDomReady = [];
      document.addEventListener = function (type, listener, options) {
        if (state === 'loading' && String(type).toLowerCase() === 'domcontentloaded' && listener) {
          queuedDomReady.push(listener);
          return;
        }
        return originalAddEventListener.call(this, type, listener, options);
      };
      function restoreAndRunDomReady() {
        document.addEventListener = originalAddEventListener;
        var readyEvent = new Event('DOMContentLoaded');
        queuedDomReady.splice(0).forEach(function (listener) {
          try {
            if (typeof listener === 'function') listener.call(document, readyEvent);
            else if (listener && typeof listener.handleEvent === 'function') listener.handleEvent(readyEvent);
          } catch (error) {
            console.error('[SharedToolRuntimeBoot] deferred DOM-ready callback failed', error);
          }
        });
      }
      // Dynamic classic scripts with async=false fetch concurrently but execute
      // in document insertion order, preserving the original dependency chain.
      bootPromise = Promise.all(lazyUrls.map(function (src) {
        if (completed[src]) return completed[src];
        var script = document.createElement('script');
        script.src = src;
        script.async = false;
        completed[src] = new Promise(function (resolve) {
          script.onload = function () { resolve(); };
          script.onerror = function () {
            console.error('[SharedToolRuntimeBoot] failed to load', src);
            resolve(); // one optional module failure must not deadlock upload UI
          };
        });
        document.head.appendChild(script);
        return completed[src];
      })).then(function () {
        restoreAndRunDomReady();
        state = 'ready';
        window.dispatchEvent(new CustomEvent('ilovepdf:shared-runtime-ready'));
        return true;
      }).catch(function (error) {
        restoreAndRunDomReady();
        state = 'failed';
        console.error('[SharedToolRuntimeBoot] runtime stack error', error);
        return false;
      });
      return bootPromise;
    }

    window.SharedToolRuntimeBoot = Object.freeze({
      loadAll: loadAll,
      getState: function () { return state; },
      getPendingCount: function () { return lazyUrls.length; }
    });

    // Warm code while the user chooses a file. If they select/drop immediately,
    // pause that one file event until the ordered runtime stack is ready.
    var replaying = false;
    function isFileInput(target) {
      return !!(target && target.matches && target.matches('input[type="file"]'));
    }
    document.addEventListener('pointerdown', function (event) {
      if (isFileInput(event.target) || (event.target.closest && event.target.closest('[data-upload-trigger], .upload-area, .upload-zone, #upload-btn, #select-files-btn'))) {
        loadAll();
      }
    }, true);
    document.addEventListener('change', function (event) {
      if (replaying || !isFileInput(event.target) || !event.target.files || !event.target.files.length) return;
      event.stopImmediatePropagation();
      event.preventDefault();
      var input = event.target;
      loadAll().then(function () {
        replaying = true;
        try { input.dispatchEvent(new Event('change', { bubbles: true, cancelable: false })); }
        finally { replaying = false; }
      });
    }, true);
    document.addEventListener('drop', function (event) {
      if (replaying || !event.dataTransfer || !event.dataTransfer.files || !event.dataTransfer.files.length) return;
      event.stopImmediatePropagation();
      event.preventDefault();
      var target = event.target;
      var transfer = event.dataTransfer;
      loadAll().then(function () {
        replaying = true;
        try {
          var replay = new DragEvent('drop', { bubbles: true, cancelable: true, dataTransfer: transfer });
          target.dispatchEvent(replay);
        } catch (error) {
          console.warn('[SharedToolRuntimeBoot] could not replay file drop; use the upload button instead', error);
        } finally { replaying = false; }
      });
    }, true);
  })(window, document);
  </script>
