<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ILovePDF — Online Tool</title>
  <meta name="description" content="Free online PDF tool by ILovePDF. No signup required. Fast and secure processing.">
  <meta name="robots" content="index, follow">
  <meta name="author" content="ILovePDF">
  <meta property="og:type"        content="website">
  <meta property="og:site_name"   content="ILovePDF">
  <meta property="og:title"       content="ILovePDF — Free Online PDF Tools">
  <meta property="og:description" content="Free online PDF tool by ILovePDF. No signup required. Fast and secure browser-based processing.">
  <meta property="og:image"       content="https://ilovepdf.cyou/favicon.svg">
  <!-- Twitter Card -->
  <meta name="twitter:card"        content="summary">
  <meta name="twitter:title"       content="ILovePDF — Free Online PDF Tools">
  <meta name="twitter:description" content="Free online PDF tool by ILovePDF. No signup required. Fast and secure browser-based processing.">
  <meta name="twitter:image"       content="https://ilovepdf.cyou/favicon.svg">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="shortcut icon" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ILovePDF">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Critical CSS only: keep the upload shell render path small. -->
  <link rel="stylesheet" href="/css/home-header-v2.css?v=20260924" data-shared-header-css="1">
  <link rel="stylesheet" href="/css/styles.css?v=20261016-shared-preview-v1">
  <!-- Footer, RTL/editor, economy, SEO/ad CSS and web fonts are intentionally
       deferred until the first screen has painted. -->
</head>
<body>

  <!-- ───────────── Shared Header (filled by chrome.js) ───────────── -->
  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="brand" aria-label="ILovePDF home">
        <span class="brand-mark"><i data-lucide="file-text"></i></span>
        <span class="brand-name">ILove<span>PDF</span></span>
      </a>

      <nav class="nav" id="nav" aria-label="Main">
        <!-- sk: nav skeleton — replaced by chrome.js nav.innerHTML -->
        <span class="sk-nav-pill" style="width:64px" aria-hidden="true"></span>
        <span class="sk-nav-pill" style="width:80px" aria-hidden="true"></span>
        <span class="sk-nav-pill" style="width:56px" aria-hidden="true"></span>
        <span class="sk-nav-pill" style="width:72px" aria-hidden="true"></span>
      </nav>
    </div>
  </header>

  <!-- ───────────── Tool content (centered, full-width, NO sidebar) ───────────── -->
  <main id="tool-content" class="tool-page">
    <!-- sk: upload / preview / download skeleton — replaced by tool-page.js renderStep() -->
    <div class="sk-upload-wrap" aria-hidden="true">
      <div class="sk-upload-icon"></div>
      <div class="sk-upload-btn"></div>
      <div class="sk-upload-line sk-upload-line--wide"></div>
      <div class="sk-upload-line sk-upload-line--narrow"></div>
    </div>
  </main>

  <!-- Tool workspaces intentionally omit the marketing footer. The shared site header remains. -->

  <!-- ───────────── Modals (kept from original tool layout) ───────────── -->
  <div id="processing-overlay" class="processing-overlay hidden" aria-live="polite">
    <div class="processing-card">
      <div class="processing-anim">
        <div class="processing-icon"><i data-lucide="file-text"></i></div>
      </div>
      <div class="processing-title" id="processing-title" data-i18n="steps.processing_file">Processing your file…</div>
      <div class="processing-msg" id="processing-msg" data-i18n="steps.usual_time">This usually takes only a few seconds.</div>
      <div class="processing-bar">
        <div class="processing-bar-fill" id="processing-bar-fill"></div>
      </div>
      <div class="processing-pct" id="processing-pct"></div>
      <button class="processing-cancel-btn hidden" id="processing-cancel-btn" type="button" aria-label="Cancel processing"><span data-i18n="modal.cancel">Cancel</span></button>
    </div>
  </div>

  <div id="cookie-banner" class="cookie-banner" role="dialog" aria-label="Cookie consent">
    <div class="cookie-inner">
      <div class="cookie-text">
        <strong>We use cookies</strong> to improve your experience. By using ILovePDF you agree to our
        <a href="/privacy">Privacy Policy</a>. Files are deleted within seconds after processing.
      </div>
      <div class="cookie-actions">
        <button class="btn btn-primary btn-sm" onclick="acceptCookies()" data-i18n="cookie.accept">Accept</button>
        <a href="/privacy" class="btn btn-outline btn-sm" data-i18n="cookie.learn_more">Learn More</a>
      </div>
    </div>
  </div>

  <!-- Lightweight upload-page bootstrap. Deferred discovery lets HTML/CSS parse
       while the critical JS graph starts downloading in parallel. -->
  <script defer src="/js/tool-page-loader.js"></script>

</body>
</html>
