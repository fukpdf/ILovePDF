name: Phase 5 ToolApp Lifecycle Isolation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'public/js/tool-app-manager.js'
      - 'scripts/phase5-toolapp-lifecycle-check.js'
      - 'package.json'
      - '.github/workflows/phase5-toolapp-lifecycle.yml'

permissions:
  contents: read

jobs:
  lifecycle-isolation:
    name: ToolApp lifecycle/isolation audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run ToolApp lifecycle/isolation audit
        run: npm run audit:phase5:toolapp-lifecycle
